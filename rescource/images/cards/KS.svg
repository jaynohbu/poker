<svg xmlns="http://www.w3.org/2000/svg" width="240" height="336" viewBox="0 0 240 336" role="img" aria-label="K of S">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f7f7f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="10" y="10" rx="16" ry="16" width="220" height="316" fill="url(#cardBg)" stroke="#dadada" stroke-width="2" filter="url(#shadow)"/>

  <text x="28" y="48" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#111111">K</text>
  <text x="28" y="78" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#111111">♠</text>

  <g transform="translate(120 168)">
    <text text-anchor="middle" dominant-baseline="central" font-family="Georgia, Times New Roman, serif" font-size="100" fill="#111111">♠</text>
  </g>

  <g transform="translate(240 336) rotate(180)">
    <text x="28" y="48" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="700" fill="#111111">K</text>
    <text x="28" y="78" font-family="Georgia, Times New Roman, serif" font-size="28" fill="#111111">♠</text>
  </g>
</svg>

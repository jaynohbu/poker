<section class="auth-wrap">
  <div class="lang-row">
    @for (opt of options; track opt.code) {
      <button type="button" (click)="setLanguage(opt.code)">{{ opt.label }}</button>
    }
  </div>
  <h1>{{ t('forgot') }}</h1>
  <form [formGroup]="form">
    <input type="email" formControlName="email" [placeholder]="t('email')" />
    <p class="field-error">{{ errorFor('email') }}</p>
    @if (!codeSent()) {
      <button type="button" class="primary" (click)="requestCode()">{{ t('sendCode') }}</button>
    }
    @if (codeSent()) {
      <input type="text" formControlName="code" [placeholder]="t('code')" />
      <p class="field-error">{{ errorFor('code') }}</p>
      <input type="password" formControlName="newPassword" [placeholder]="t('newPassword')" />
      <p class="field-error">{{ errorFor('newPassword') }}</p>
      <button type="button" class="primary" (click)="resetPassword()">{{ t('resetBtn') }}</button>
    }
  </form>
  <p class="error">{{ error() }}</p>
  <nav><a routerLink="/auth/login">{{ t('backLogin') }}</a></nav>
</section>

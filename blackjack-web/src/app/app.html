<div class="page-bg" aria-hidden="true">
	<div class="orb orb-one"></div>
	<div class="orb orb-two"></div>
	<div class="grain"></div>
</div>

<div class="app-shell" [class.lang-ko]="language() === 'ko'">
	@if (showNavigation()) {
		<nav class="top-nav">
			<a class="brand-link" routerLink="/">{{ t('brand') }}</a>
			<div class="nav-links">
				<a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ t('navHome') }}</a>
				<a routerLink="/blog" routerLinkActive="active">{{ t('navBlog') }}</a>
				<a routerLink="/story" routerLinkActive="active">{{ t('navStory') }}</a>
				@if (authenticated()) {
					<a routerLink="/profile" routerLinkActive="active">{{ t('navProfile') }}</a>
					<button type="button" class="logout-btn" (click)="logout()">{{ t('navLogout') }}</button>
				} @else {
					<a class="login-btn" routerLink="/auth/login" routerLinkActive="active">{{ t('login') }}</a>
				}
			</div>
		</nav>
	}

	<div class="app-content">
		<router-outlet />
	</div>
</div>

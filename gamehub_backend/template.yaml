AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: GameHub backend SAM infrastructure and deployment stack.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
  CorsOrigins:
    Type: String
    Default: http://localhost:55123,http://localhost:4200
  BlogImagesBucket:
    Type: String
    Default: gh_blog_images
  BlogImagesRegion:
    Type: String
    Default: ap-northeast-2
  BlogImagesPublicBaseUrl:
    Type: String
    Default: ''
  OpenAiApiKey:
    Type: String
    Default: ''
    NoEcho: true
  OpenAiTranslationModel:
    Type: String
    Default: gpt-4o-mini

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64
    Environment:
      Variables:
        DYNAMODB_INIT: 'false'
        DYNAMODB_SEED: 'false'
        DYNAMODB_MIGRATE_ARTICLE_CONTENT: 'false'
        CORS_ORIGINS: !Ref CorsOrigins
        BLOG_IMAGES_BUCKET: !Ref BlogImagesBucket
        BLOG_IMAGES_REGION: !Ref BlogImagesRegion
        BLOG_IMAGES_PUBLIC_BASE_URL: !Ref BlogImagesPublicBaseUrl
        OPENAI_API_KEY: !Ref OpenAiApiKey
        OPENAI_TRANSLATION_MODEL: !Ref OpenAiTranslationModel

Resources:
  ApiGateway:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref EnvironmentName

  ArticlesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub gh_articles_${EnvironmentName}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slug
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH

  BackendFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: dist/lambda.handler
      Environment:
        Variables:
          ARTICLES_TABLE_NAME: !Ref ArticlesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ArticlesTable
        - Statement:
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: !Sub arn:aws:s3:::${BlogImagesBucket}
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource:
                - !Sub arn:aws:s3:::${BlogImagesBucket}/blog_images/*
                - !Sub arn:aws:s3:::${BlogImagesBucket}/profile_images/*
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: ANY
            Path: /
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ApiGateway
            Method: ANY
            Path: /{proxy+}

Outputs:
  ApiEndpoint:
    Description: Public URL of deployed backend API
    Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}
  ArticlesTableName:
    Description: DynamoDB table name for articles
    Value: !Ref ArticlesTable
